apiVersion: v1
kind: Pod
metadata:
  name: netem-client
  namespace: k8s-network-lab
spec:
  containers:
    - name: netem
      image: nicolaka/netshoot:latest
      command:
        - sh
        - -c
        - tc qdisc add dev eth0 root netem delay 120ms 30ms loss 1%; sleep 3600
      securityContext:
        capabilities:
          add:
            - NET_ADMIN
